[project]
name = "loki"
version = "0.2.0"
description = "Galateia Mascot/LOKI - avatar animado flutuando no desktop, processo separado consumido pela GAIA via named pipe local."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "keyboard>=0.13",
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
]

# Só o pipeline de animações (`scripts/`) usa estas - o processo do Mascot
# (`mascot/`, `core/`) nunca importa nenhuma. Instaladas por padrão no
# `uv sync` (ver `[tool.uv]`), então os .bat do pipeline continuam valendo;
# `uv sync --no-group pipeline` monta um ambiente só de runtime.
[dependency-groups]
pipeline = [
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[tool.uv]
default-groups = ["pipeline"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mascot*", "core*"]

[project.scripts]
loki = "mascot.process_main:main"
